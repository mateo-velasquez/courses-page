services:
  database:
    build: ./database
    env_file:
      - ./backend/.env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_TCP_PORT: ${MYSQL_TCP_PORT}
    ports:
      - "${MYSQL_TCP_PORT}:3306"
    expose:
      - ${MYSQL_TCP_PORT}
    volumes:
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      timeout: 20s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
      - ./backend/db/.env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8090:8090"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
